[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cardmarket-optimizer-api"
version = "0.1.0"
description = "FastAPI service for Cardmarket order optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28.1",
  "ortools>=9.14,<10",
  "pydantic>=2.11,<3",
  "pytest>=8.4.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
cm-import-shipping = "app.import_shipping_costs:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
